<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#6a8aa8}</style></head><body><canvas id="c" width="2400" height="1300"></canvas>
<script type="module">
import * as T from "./toon.js";
const C = document.getElementById("c"), G = C.getContext("2d"); let x = 10;
const cell = (d, fn, H = 600, y = 20) => { const c = document.createElement("canvas"); c.width = d[0]; c.height = d[1]; const g = c.getContext("2d"); g.lineJoin = "round"; g.lineCap = "round"; fn(new T.Pen(g)); const s = H / d[1]; G.drawImage(c, x, y, d[0] * s, d[1] * s); x += d[0] * s + 10; };
cell([1000, 560], (p) => T.drawHook(p, 1, 1, 1, 0), 500);
cell([600, 1000], (p) => T.drawScientist(p, {}));
cell([600, 1000], (p) => T.drawWalker(p, { expr: "smile" }));
cell([800, 800], (p) => T.drawSlash2(p, 1), 400);
x = 10;
cell([1000, 240], (p) => T.drawOverlay(p, "ताल = सत्य", "gold"), 220, 700);
cell([1000, 240], (p) => T.drawOverlay(p, "तालको पिँध", "ice"), 220, 700);
cell([1000, 220], (p) => T.drawSeismo(p, Array.from({length: 60}, (_, i) => Math.sin(i * 2.7) * (i > 40 ? 0.9 : 0.08))), 200, 700);
window.done = true;
</script></body></html>
